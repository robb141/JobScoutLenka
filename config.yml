# Global role keywords, in English. LinkedIn searches these directly, and
# every source uses the full multilingual set (this list plus each source's
# own `keywords:` below) to decide whether a scraped posting really is a
# match. Seniority words ("junior", "senior", ...) are stripped automatically.
roles:
  - Biochemist
  - Biochemistry
  - Biotechnology
  - Molecular biology
  - Cell culture
  - Analytical chemist
  - Analytical chemistry
  - Chemist
  - Laboratory technician
  - Laboratory analyst
  - Medical laboratory
  - Bioanalytical
  - Quality control
  - QC analyst
  - Quality assurance
  - GMP
  - Validation
  - R&D scientist
  - Drug development
  - Formulation scientist
  - Microbiologist
  - Immunology
  - Bioinformatics
  - Clinical research associate
  - Regulatory affairs
  - Pharmacovigilance
  - Pharmaceutical

# Keep true so postings that only say "Bratislavský kraj" or "Wien-Umgebung"
# (no specific town) still show up, tagged as a region rather than a city.
include_unspecified: true

max_pages_per_query: 2
request_delay_seconds: 1.0

sources:
  profesia:
    enabled: true
    # Slovak region slug pinned in the URL path. "bratislavsky-kraj" is
    # Bratislava plus its commuter belt. Use "" to search all of Slovakia.
    region: bratislavsky-kraj
    # Slovak search terms - Profesia is a Slovak-language board.
    keywords:
      - Biochemik
      - Biochémia
      - Biotechnológ
      - Molekulárna biológia
      - Laborant
      - Laboratórny technik
      - Laboratórny analytik
      - Zdravotnícky laborant
      - Chemik
      - Chemický analytik
      - Analytická chémia
      - Kontrola kvality
      - Kontrolór kvality
      - Kontrola kvality liečiv
      - Mikrobiológ
      - Výskumný pracovník
      - Vývoj a výskum
      - Farmaceutický laborant
      - Farmaceutická výroba
      - Vývoj liečiv
      - Validácia
      - Regulačné záležitosti
  karriere_at:
    enabled: true
    # Austrian states searched, then filtered down to Vienna + towns within
    # commuting distance of Kittsee.
    locations:
      - Wien
      - Niederösterreich
      - Burgenland
    # German search terms - karriere.at is a German-language board.
    keywords:
      - Biochemie
      - Biochemiker
      - Biotechnologie
      - Molekularbiologie
      - Chemiker
      - Chemielaborant
      - Biologielaborant
      - Labortechniker
      - Laborant
      - Laborassistenz
      - technische Assistenz
      - Bioanalytik
      - analytische Chemie
      - Zellkultur
      - Qualitätskontrolle
      - Qualitätssicherung
      - GMP
      - Validierung
      - Mikrobiologie
      - Pharmazie
      - Pharmakovigilanz
      - Regulatory Affairs
      - Wirkstoff
      - Forschung Entwicklung
  linkedin:
    # Public guest search; rate-limited by LinkedIn, failed queries are skipped.
    # No `keywords:` here, so it uses the English `roles` list above.
    enabled: true
    locations:
      - "Bratislava, Slovakia"
      - "Vienna, Austria"
      - "Kittsee, Austria"
  company_pages:
    enabled: true
    # Direct career / listing pages. Per entry:
    #   location      shown in the report; refines a bare "Vienna" to a district
    #   note          text prepended to the Description column
    #   link_pattern  regex an href must match to count as a job (for quirky
    #                 URL schemes); a generic pattern is used otherwise
    #   single_site   when true, `location` also *admits* rows that name no
    #                 place - only for genuinely one-location employers
    # The Slovak market is largely covered by Profesia; these fill gaps.
    # Big global portals only surface a hit when a matching role is open, and
    # JS-only listing pages may yield nothing.
    pages:
      - company: Slovak Academy of Sciences
        url: "https://www.sav.sk/?lang=sk&doc=board-job"
        location: Bratislava
        link_pattern: "jobs_offer_no="
        single_site: true
        note: "Relevantné ústavy (Chemický ústav, Ústav molekulárnej biológie, Biomedicínske centrum, Virologický ústav) sú v Bratislave - iné lokality si over v názve ústavu"
      - company: Lexogen
        url: "https://lexogen.jobs.personio.de/"
        location: Vienna 3 (Vienna BioCenter)
        single_site: true
        note: "NGS / molekulárna biológia; pracovný jazyk angličtina"
      - company: University of Vienna
        url: https://jobs.univie.ac.at/go/Alle-Jobangebote/8879601/
        location: Vienna 9 (Alsergrund) / Vienna 3 (Vienna BioCenter)
        note: "Nemčina: C1 pre pedagogické/administratívne pozície; veľa výskumných pozícií je v angličtine"
      - company: Takeda
        url: https://www.takedajobs.com/en/search-jobs/Vienna%2C%20Austria/
        location: Vienna 22 (Donaustadt)
        note: "Nemčina: B2+ pre výrobu a kontrolu kvality; časť R&D pozícií v angličtine"
      - company: Boehringer Ingelheim RCV
        url: https://jobs.boehringer-ingelheim.com/search-jobs/Vienna%2C%20Austria/
        location: Vienna 12 (Meidling)
        note: "Nemčina: B2–C1 pre väčšinu pozícií; globálne R&D pozície občas v angličtine"
      - company: Valneva Austria
        url: https://valneva.com/careers/
        location: Vienna 3 (Landstraße, Campus Vienna Biocenter)
        note: "Pracovný jazyk angličtina; nemčina zvyčajne nie je podmienkou"
