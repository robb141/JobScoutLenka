name: Collect jobs

on:
  workflow_dispatch: {}
  schedule:
    # 05:30 UTC on weekdays - fresh postings before Lenka's morning.
    - cron: "30 5 * * 1-5"
  push:
    branches: [main]
    paths:
      - "jobscout/**"
      - "config.yml"
      - ".github/workflows/collect.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore state
        uses: actions/cache@v4
        with:
          path: data/state.json
          key: jobscout-state-${{ github.run_id }}
          restore-keys: |
            jobscout-state-

      - name: Collect jobs
        run: python -m jobscout collect

      # Always available: download output/index.html from the run's summary.
      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: output/index.html
          retention-days: 90

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

  # Bonus: render the report at a URL. Needs GitHub Pages, which requires a
  # public repo (or a paid plan) - the step is allowed to fail otherwise.
  publish:
    needs: collect
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
