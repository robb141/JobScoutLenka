name: Collect jobs

on:
  workflow_dispatch: {}
  schedule:
    # 05:30 UTC Friday morning - fresh postings before the week's review.
    - cron: "30 5 * * 5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore state
        uses: actions/cache@v6
        with:
          path: data/state.json
          # Bump the vN prefix to start a clean slate: the next run finds no
          # prior state, so every posting is reported as NEW.
          key: jobscout-state-v2-${{ github.run_id }}
          restore-keys: |
            jobscout-state-v2-

      - name: Collect jobs
        run: python -m jobscout collect

      # Always available: download output/index.html from the run's summary.
      - name: Upload report artifact
        uses: actions/upload-artifact@v7
        with:
          name: report
          path: output/index.html
          retention-days: 90

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: output

  # Bonus: render the report at a URL. Needs GitHub Pages, which requires a
  # public repo (or a paid plan) - the step is allowed to fail otherwise.
  publish:
    needs: collect
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
